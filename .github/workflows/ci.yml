name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node == 24
        run: npm audit --omit=dev --audit-level=high
      - if: matrix.node == 24
        name: Verify installed package executable
        run: |
          package_tarball="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/abs-package-smoke" "$RUNNER_TEMP/$package_tarball"
          node scripts/stdio-smoke.mjs "$RUNNER_TEMP/abs-package-smoke/node_modules/@ronanlion/mcp-server-abs/dist/index.js"
